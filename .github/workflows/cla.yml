name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target runs in the context of the base repo, which is what gives
# the job a token with write access on PRs opened from forks. It must never
# check out or execute code from the PR head — this workflow only posts
# comments and statuses, so it does no checkout at all.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only react to the acceptance phrase, never to unrelated PR comments.
    if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - name: Check or record CLA signature
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live on their own branch so they never touch main's history.
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          # Derived from the repository itself, so renaming it or moving it to an
          # organization does not leave broken links in the bot's comment.
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          allowlist: dependabot[bot],github-actions[bot],renovate[bot]

          custom-notsigned-prcomment: |
            Thanks for the pull request — there is one step before it can be merged.

            We ask contributors to accept the [Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md). The short version: **you keep the copyright to your work**, anything already released under MIT stays MIT permanently and stays forkable by anyone, and the project can relicense contributions in future releases. The reasoning is written out in [Decision 1](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/decisions/001-license-is-mit.md) — questions are welcome, just ask here.

            If you agree, reply to this pull request with exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: CLA signed — thanks. This check will stay green for all your future pull requests.
