name: Release

# Level two of the two described in docs/technical/process/ci.md: packaging
# and publishing, triggered by the tag `tom release` leaves
# (docs/technical/process/versioning.md). Unsigned at launch — the macOS
# dmg and the Linux AppImage/deb need no certificate; Windows packages as
# `exe` rather than `msix`, because an unsigned msix refuses to install by a
# double-click.
#
# fastforge (the Dart CLI, `dart pub global activate fastforge` — the
# successor to the discontinued `flutter_distributor`) builds and packages
# on each platform's own runner, one job each; a fourth job downloads all
# three artifacts and publishes them to one draft GitHub Release, sequentially,
# so two jobs never race to create the same release.
#
# A manual run (workflow_dispatch) builds and uploads the three artifacts as
# workflow artifacts for inspection, but never publishes — only a real `v*`
# tag does that, which is also the one case `startsWith(github.ref, …)` below
# is reached for a push.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only here, as pr-checks.yml is — only the publish job below asks for
# write, and only on itself, which is where creating a release needs it
# (docs/technical/process/repository-settings/actions.md). Still no
# configured secret: GITHUB_TOKEN is the ambient token every workflow gets.
permissions:
  contents: read

jobs:
  package-macos:
    name: Package (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: src/.fvmrc
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve the workspace
        run: make setup

      - name: Install fastforge
        shell: bash
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Package — dmg
        shell: bash
        working-directory: src/apps/desktop
        run: |
          # A real release tag names its own version; a manual run (no tag)
          # falls back to the pubspec's, same as a local, unreleased build.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          fi
          BUILD="$(git rev-parse --short HEAD)"
          fastforge package --platform=macos --targets=dmg \
            --build-dart-define TOM_VERSION="$VERSION" \
            --build-dart-define TOM_BUILD="$BUILD" \
            --build-dart-define TOM_RELEASES=true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src/apps/desktop/dist/**/*.dmg
          if-no-files-found: error

  package-windows:
    name: Package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: src/.fvmrc
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve the workspace
        run: make setup

      # Inno Setup 6 ships on GitHub's windows-latest image already — the exe
      # packager calls its ISCC.exe. Unverified beyond that image's own
      # documented tool list; the first real run is the actual proof.
      - name: Install fastforge
        shell: bash
        run: |
          dart pub global activate fastforge
          echo "$APPDATA/Pub/Cache/bin" >> "$GITHUB_PATH"

      - name: Package — exe
        shell: bash
        working-directory: src/apps/desktop
        run: |
          # A real release tag names its own version; a manual run (no tag)
          # falls back to the pubspec's, same as a local, unreleased build.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          fi
          BUILD="$(git rev-parse --short HEAD)"
          fastforge package --platform=windows --targets=exe \
            --build-dart-define TOM_VERSION="$VERSION" \
            --build-dart-define TOM_BUILD="$BUILD" \
            --build-dart-define TOM_RELEASES=true

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src/apps/desktop/dist/**/*.exe
          if-no-files-found: error

  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: src/.fvmrc
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # dpkg-dev is dpkg-deb, for the .deb target; the rest builds the app
      # itself, as in pr-checks.yml's headless end-to-end step.
      - name: Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev dpkg-dev

      # appimagetool ships as an AppImage itself, and GitHub's runners have no
      # FUSE to run one — extracting it once sidesteps that, a documented
      # workaround for this exact tool in this exact environment.
      - name: Install appimagetool
        run: |
          curl -L -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -s /opt/appimagetool/AppRun /usr/local/bin/appimagetool

      - name: Resolve the workspace
        run: make setup

      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Package — AppImage, deb
        working-directory: src/apps/desktop
        run: |
          # A real release tag names its own version; a manual run (no tag)
          # falls back to the pubspec's, same as a local, unreleased build.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          fi
          BUILD="$(git rev-parse --short HEAD)"
          fastforge package --platform=linux --targets=appimage,deb \
            --build-dart-define TOM_VERSION="$VERSION" \
            --build-dart-define TOM_BUILD="$BUILD" \
            --build-dart-define TOM_RELEASES=true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src/apps/desktop/dist/**/*.AppImage
            src/apps/desktop/dist/**/*.deb
          if-no-files-found: error

  publish:
    name: Publish (draft release)
    runs-on: ubuntu-latest
    needs: [package-macos, package-windows, package-linux]
    # A manual run proves the three platforms still package; it publishes
    # nothing, so running it twice leaves no stray draft behind.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: src/.fvmrc
          cache: true

      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      # One release, found by title on the second and third call and created
      # on the first — sequential in one job so two platforms never race to
      # create it (docs/technical/process/versioning.md).
      - name: Publish every artifact to one draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for file in artifacts/*/*; do
            fastforge publish --path "$file" --targets=github \
              --github-repo "${{ github.repository }}" \
              --app-version "$VERSION" \
              --github-release-title "v$VERSION" \
              --github-release-draft true
          done
