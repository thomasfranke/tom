name: CI

# Level one of the two described in docs/technical/process/ci.md:
# format, analyze, a from-scratch codegen run (fails on drift between
# committed .g.dart/.freezed.dart and what build_runner actually produces),
# the architecture test, dart test on the six pure packages and flutter test
# on the app, plus the coverage gate. Required to merge. The tag-triggered
# build/sign/package pipeline is level two and lives in its own workflow,
# added when there is something to sign.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by default (docs/technical/process/repository-settings.md); this workflow
# never needs to write anything.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src/.fvmrc is the single source of truth for the Flutter version —
      # Makefile reads the same file for `make fvm`.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: src/.fvmrc
          cache: true

      - name: Enable desktop platforms
        run: flutter config --enable-windows-desktop --enable-macos-desktop --enable-linux-desktop

      - name: Resolve the workspace
        run: make setup

      - name: Format
        run: make format

      - name: Analyze
        run: make analyze

      # These two used to be fifty lines of inlined bash, because the
      # dashboards behind them redraw with ANSI cursor moves that a CI log
      # prints as new lines instead of overwriting. They now detect the
      # absence of a terminal (tool/src/tty.dart) and switch to append-only
      # output, so CI runs exactly what a developer runs — one implementation,
      # and the one exercised locally every day.
      - name: Codegen — regenerate from scratch, fail on drift
        run: dart run tool/tom.dart codegen-gate

      - name: Test — architecture, the six packages, the apps
        run: make flutter-test

      - name: Coverage gate
        run: make coverage-gate

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: src/.fvmrc
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve the workspace
        run: make setup

      - name: Compile check (community build — not the distributed artifact)
        run: make build-macos
