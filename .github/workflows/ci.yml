name: CI

# Level one of the two described in docs/process/setup.md#ci-in-two-levels:
# format, analyze, the architecture test, dart test on the six pure packages
# and flutter test on the app, plus the coverage gate. Required to merge.
# The tag-triggered build/sign/package pipeline is level two and lives in its
# own workflow, added when there is something to sign.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by default (docs/process/repository-settings.md); this workflow
# never needs to write anything.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src/.fvmrc is the single source of truth for the Flutter version —
      # Makefile reads the same file for `make fvm`.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: src/.fvmrc
          cache: true

      - name: Enable desktop platforms
        run: flutter config --enable-windows-desktop --enable-macos-desktop --enable-linux-desktop

      - name: Resolve the workspace
        run: make setup

      - name: Format
        run: make format

      - name: Analyze
        run: make analyze

      - name: Test — architecture, the six pure packages, the app
        run: make flutter-test

      - name: Coverage gate
        run: make coverage-gate

  build-linux:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: src/.fvmrc
          cache: true

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve the workspace
        run: make setup

      - name: Compile check (community build — not the distributed artifact)
        run: make build-linux
