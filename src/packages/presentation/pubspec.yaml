name: tom_presentation
description: "UI state: the space session, notifiers and view models. Pure Dart — it cannot import Flutter."
version: 0.1.0
publish_to: none
repository: https://github.com/thomasfranke/tom

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  freezed_annotation: ^3.1.0
  # The pure Dart half of Riverpod. `flutter_riverpod` is the app's; this
  # package must not see a widget, and rule 6 allows state here and in the
  # composition root, nowhere else (Decision 7).
  riverpod: 3.2.1
  riverpod_annotation: 4.0.2
  tom_application:
    path: ../application
  tom_core:
    path: ../core
  tom_domain:
    path: ../domain

dev_dependencies:
  build_runner: ^2.15.1
  freezed: 3.2.5
  lints: ^6.0.0
  riverpod_generator: 4.0.3
  test: ^1.25.6
