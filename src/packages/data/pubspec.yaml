name: tom_data
description: >-
  The data layer's inner half: the repository implementations that fulfil the
  domain's contracts over the capabilities, and the parsers in between.
version: 0.1.0
publish_to: none
repository: https://github.com/thomasfranke/tom

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  freezed_annotation: ^3.1.0
  tom_core:
    path: ../core
  tom_domain:
    path: ../domain

  # The capabilities this layer is written against — contract, failure and
  # DTO, each beside the adapters that fulfil it (Decision 24). This package
  # is the consumer, so the arrow points outwards.
  tom_infra:
    path: ../infra

dev_dependencies:
  build_runner: ^2.15.1
  freezed: 3.2.5
  lints: ^6.0.0
  test: ^1.25.6
