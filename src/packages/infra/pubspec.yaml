name: tom_infra
description: >-
  The data layer's outer half: one folder per capability, holding its
  contract, its failures, the DTOs that cross it — and one subfolder per
  implementation, named after the package that does the work.
version: 0.1.0
publish_to: none
repository: https://github.com/thomasfranke/tom

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  # Myers over lists, for the rendered diff (Decision 27). It stays with the
  # adapter that uses it: the capability answers positions, so no package
  # type crosses the contract.
  diffutil_dart: ^5.0.0

  # Generated equality for the failures this package owns, which is all of
  # the technical ones (Decision 16).
  freezed_annotation: ^3.1.0

  # The block parser, and the verdict of Spike B (Decision 19). It stays with
  # the adapter that uses it: no `markdown` type crosses the contract, so
  # nothing else in the workspace ever sees one.
  markdown: ^7.3.0

  meta: ^1.16.0

  # FTS5, for full-text search. It stays with the adapter that uses it: no
  # sqlite type crosses the contract, and the library itself is the system's
  # on macOS and Linux and `sqlite3_flutter_libs`' in the app.
  sqlite3: ^2.9.0

  # `tom_core` and nothing else, which is the guarantee (Decision 24): this
  # package cannot name a domain type, because it cannot see the package
  # that holds them.
  tom_core:
    path: ../core

  # The DTOs the contracts answer with, which are declared in the data layer
  # (Decision 21). The two packages depend on each other: `tom_data` needs
  # the contracts, this needs the shapes that cross them — pub resolves it,
  # and the layer they belong to is one layer anyway (Decision 24).
  tom_data:
    path: ../data

dev_dependencies:
  build_runner: ^2.15.1
  freezed: 3.2.5
  lints: ^6.0.0
  test: ^1.25.6
