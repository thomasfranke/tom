name: tom_core
description: "Result, AppFailure and the primitives every layer shares. Depends on no tom_* package."
version: 0.1.0
publish_to: none
repository: https://github.com/thomasfranke/tom

environment:
  sdk: ^3.12.0

resolution: workspace

# The bottom of the graph: no tom_* dependency, and the only external one is
# freezed_annotation — pure annotations, no runtime behaviour, needed so
# AppFailure's variants get generated equality instead of hand-written ==.

dependencies:
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ^2.15.1
  freezed: 3.2.5
  lints: ^6.0.0
  test: ^1.25.6
