name: tom_desktop
description: >-
  The desktop application: composition root and widgets. The only package in the
  workspace that depends on Flutter, and the only one that knows which
  implementation satisfies which contract.
publish_to: none
repository: https://github.com/thomasfranke/tom

# The product version. Every package moves in lockstep with this number — none
# is published separately, so independent versioning would be bookkeeping with
# no reader. Releases are tags; see docs/technical/process/versioning.md.
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.8

  # The native "open folder" dialog. A Flutter plugin, so it can only live
  # here — which is why nothing below takes a folder from anywhere but its
  # own arguments.
  file_selector: ^1.1.0

  flutter:
    sdk: flutter

  # Renders the inline content *inside* a block. Block-level layout and the
  # container around each block are ours, which is what the rendered diff
  # needs (docs/technical/runtime/documents.md).
  flutter_markdown_plus: ^1.0.12

  # State, and one of only two packages above the pure Dart layers.
  # Riverpod lives in presentation and here, never below (Decision 7).
  # Pinned exactly because `riverpod_annotation` pins the runtime it
  # generates against: the pair moves together or not at all.
  flutter_riverpod: 3.2.1

  # Source mode. Measured against the fallback and kept: 4.4ms build p50
  # while typing a 2853-line document, against a plain TextField's 38.8ms
  # (Decision 18).
  re_editor: ^0.10.0

  # Syntax highlighting for the code blocks in the preview — the same
  # package `re_editor` brings for source mode (Decision 18).
  re_highlight: ^0.0.3

  riverpod_annotation: 4.0.2

  # The whole graph, because this is the composition root: the one place
  # allowed to see an implementation and hand it to whatever declared the
  # contract. No package below may depend on a package above it.
  tom_application:
    path: ../../packages/application
  tom_core:
    path: ../../packages/core
  tom_data:
    path: ../../packages/data
  tom_domain:
    path: ../../packages/domain
  tom_infra:
    path: ../../packages/infra
  tom_presentation:
    path: ../../packages/presentation

  # The look, shared with tom_mobile: colour roles, metrics, the marks and the
  # components. A screen is this application's; what it is drawn with is not.
  tom_ui:
    path: ../../packages/ui

  # Window control: title, and a minimum size the layout holds together in
  # (docs/product/workspace/doc.md).
  window_manager: ^0.5.2

dev_dependencies:
  # Codegen for the providers below. Pinned exactly, like every other
  # generator here: a build tool that moves on its own produces a diff
  # nobody wrote.
  build_runner: ^2.15.1

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  # The binding the end-to-end scenarios run under. `flutter test` alone
  # runs in a fake-async zone where real file I/O and a real `Process.run`
  # never complete, so an app that reads folders and drives git can only be
  # driven on a device — which is what this provides.
  integration_test:
    sdk: flutter

  riverpod_generator: 4.0.3


flutter:
  uses-material-design: true
