name: tom_desktop
description: >-
  The desktop application: composition root and widgets. The only package in the
  workspace that depends on Flutter, and the only one that knows which
  implementation satisfies which contract.
publish_to: none
repository: https://github.com/thomasfranke/tom

# The product version. Every package moves in lockstep with this number — none
# is published separately, so independent versioning would be bookkeeping with
# no reader. Releases are tags; see docs/versioning.md.
version: 0.1.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter

  # The block parser, and the verdict of Spike B
  # (docs/technical/decisions/019-...). It belongs in tom_infra behind a
  # capability contract when M0 builds the preview; it is here for now
  # because the spike that chose it is here.
  markdown: ^7.3.0

  # Source mode, and the highlighting rules it reads markdown through —
  # the verdict of Spike A (docs/technical/decisions/018-...). Pinned to a
  # minor: the package tracks Flutter closely, and a Flutter upgrade is the
  # moment to check it first.
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

  # The whole graph, because this is the composition root: the one place
  # allowed to see an implementation and hand it to whatever declared the
  # contract. No package below may depend on a package above it.
  tom_application:
    path: ../../packages/application
  tom_core:
    path: ../../packages/core
  tom_data:
    path: ../../packages/data
  tom_domain:
    path: ../../packages/domain
  tom_infra:
    path: ../../packages/infra
  tom_presentation:
    path: ../../packages/presentation

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
